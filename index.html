<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DRILL44 AI</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="noise"></div>
  <div class="app-shell">
    <aside class="sidebar glass">
      <div class="brand">
        <img src="/assets/favicon.svg" alt="DRILL44 AI favicon" />
        <span>DRILL44 AI</span>
      </div>
      <button class="nav-btn active" data-view="scene">Редактор сцены</button>
      <button class="nav-btn" data-view="faceswap">Face Swap (NanoBanana)</button>
      <button class="nav-btn" data-view="carousel">Карусель вариаций</button>
    </aside>

    <main class="workspace glass">
      <header>
        <h1 id="viewTitle">Редактор сцены</h1>
        <div class="status" id="jobStatus">Готово</div>
      </header>

      <section id="sceneView" class="view active"></section>
      <section id="faceswapView" class="view"></section>
      <section id="carouselView" class="view"></section>
    </main>

    <aside class="settings glass collapsed" id="settingsPanel">
      <button class="toggle-settings" id="toggleSettings">⚙️ Настройки</button>
      <div class="settings-content">
        <h2>Провайдеры и параметры</h2>
        <label>Формат промптов
          <select id="promptFormat">
            <option value="classic">Текстовый (Classic)</option>
            <option value="json">JSON</option>
          </select>
        </label>

        <label>LLM провайдер
          <select id="selectedPromptProvider">
            <option value="openai">OpenAI (ChatGPT)</option>
            <option value="xai">xAI (Grok)</option>
            <option value="anthropic">Anthropic (Claude)</option>
            <option value="google">Google (Gemini)</option>
          </select>
        </label>

        <div id="providerSettings"></div>

        <h3>NanoBanana</h3>
        <label>Base URL <input id="nanoBaseUrl" type="text" /></label>
        <label>API Key <input id="nanoApiKey" type="password" autocomplete="off" /></label>
        <label>Модель
          <select id="nanoModel">
            <option value="pro">NanoBanana Pro</option>
            <option value="v2">NanoBanana 2</option>
          </select>
        </label>
        <label>scenePath <input id="nanoScenePath" type="text" /></label>
        <label>faceSwapPath <input id="nanoFaceSwapPath" type="text" /></label>
        <label>carouselPath <input id="nanoCarouselPath" type="text" /></label>

        <label class="check-row"><input type="checkbox" id="showKeys" /> Показать ключи</label>
        <div class="btn-row">
          <button id="saveSettings">Сохранить</button>
          <button id="testPromptProvider">Проверить LLM</button>
          <button id="testNano">Проверить NanoBanana</button>
          <button id="resetKeys" class="danger">Сбросить ключи</button>
        </div>
      </div>
    </aside>
  </div>

  <div id="toastRoot"></div>
  <script src="/app.js"></script>
</body>
</html>
